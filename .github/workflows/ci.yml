name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  front:
    name: "Front (regresión + build)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Browser checks resolve the existing Puppeteer dependency from backend/.
      - name: Install browser harness dependencies
        run: npm --prefix backend ci --ignore-scripts
      - name: Locate installed browser for layout regression
        run: |
          task_browser_path="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$task_browser_path"
          printf 'PUPPETEER_EXECUTABLE_PATH=%s\n' "$task_browser_path" >> "$GITHUB_ENV"
          "$task_browser_path" --version
      - name: Release regression
        run: |
          set -o pipefail
          set +e
          npm run test:release-regression 2>&1 | tee "$RUNNER_TEMP/scale-release-regression.log"
          scale_regression_exit=$?
          set -e
          if [ "$scale_regression_exit" -ne 0 ]; then
            node build-tools/report-ci-regression.mjs "$RUNNER_TEMP/scale-release-regression.log"
          fi
          exit "$scale_regression_exit"
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Build
        run: npx next build
      - name: Verify build artifact
        run: |
          test -s .next/BUILD_ID
          node build-tools/check-initial-assets.mjs
          echo "BUILD_ID: $(cat .next/BUILD_ID)"

  backend:
    name: "Backend (test:release)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Release suite
        run: npm run test:release
