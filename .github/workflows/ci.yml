name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  front:
    name: "Front (regresión + build)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Browser checks resolve the existing Puppeteer dependency from backend/.
      - name: Install browser harness dependencies
        run: npm --prefix backend ci --ignore-scripts
      - name: Release regression
        run: npm run test:release-regression
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Build
        run: npx next build
      - name: Verify build artifact
        run: |
          test -s .next/BUILD_ID
          node build-tools/check-initial-assets.mjs
          echo "BUILD_ID: $(cat .next/BUILD_ID)"

  backend:
    name: "Backend (test:release)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Release suite
        run: npm run test:release

  printing:
    name: "Impresión 80 mm (API, agente y paquete)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      printing-postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: printing_fixture
          POSTGRES_PASSWORD: fixture_only
          POSTGRES_DB: printing_fixture
        ports:
          - 55479:5432
        options: >-
          --health-cmd "pg_isready -U printing_fixture -d printing_fixture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend test dependencies
        run: npm --prefix backend ci
      - name: Renderer, API and local agent
        run: |
          node backend/test-printing-renderer.mjs
          node backend/test-printing.mjs
          node --test print-agent/test/*.test.mjs
          node print-agent/test-api-integration.mjs
      - name: PostgreSQL 17 races (dedicated fixture service)
        env:
          SCALE_PRINT_TEST_PG_CI_URL: postgresql://printing_fixture:fixture_only@127.0.0.1:55479/printing_fixture
        run: node backend/test-printing-postgres.mjs
      - name: Package reviewed local agent
        run: node build-tools/pack-print-agent.mjs "$RUNNER_TEMP/scale-print-agent"
      - uses: actions/upload-artifact@v4
        with:
          name: scale-print-agent-80mm
          path: ${{ runner.temp }}/scale-print-agent/
          if-no-files-found: error
          retention-days: 14
